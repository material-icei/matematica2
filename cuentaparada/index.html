<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuenta parada - 2° grado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ================= MENÚ PRINCIPAL ================= -->
  <section id="pantalla-menu" class="pantalla">
    <header class="cabecera-menu">
      <h1>🏠 Cuenta parada</h1>
      <p class="subtitulo">Elegí un modo de juego para practicar sumas y restas con la casita C-D-U</p>
    </header>

    <div class="tarjetas-modos">
      <button class="tarjeta-modo" id="modo-suma-facil" data-modo="suma-facil">
        <span class="tarjeta-emoji">➕</span>
        <span class="tarjeta-titulo">Suma</span>
        <span class="tarjeta-nivel nivel-facil">Sin dificultad</span>
      </button>

      <button class="tarjeta-modo" id="modo-suma-dificil" data-modo="suma-dificil">
        <span class="tarjeta-emoji">➕🔥</span>
        <span class="tarjeta-titulo">Suma</span>
        <span class="tarjeta-nivel nivel-dificil">Con dificultad</span>
      </button>

      <button class="tarjeta-modo" id="modo-resta-facil" data-modo="resta-facil">
        <span class="tarjeta-emoji">➖</span>
        <span class="tarjeta-titulo">Resta</span>
        <span class="tarjeta-nivel nivel-facil">Sin dificultad</span>
      </button>

      <button class="tarjeta-modo" id="modo-resta-dificil" data-modo="resta-dificil">
        <span class="tarjeta-emoji">➖🔥</span>
        <span class="tarjeta-titulo">Resta</span>
        <span class="tarjeta-nivel nivel-dificil">Con dificultad</span>
      </button>
    </div>
  </section>

  <!-- ================= PANTALLA DE JUEGO ================= -->
  <section id="pantalla-juego" class="pantalla oculto">
    <header class="cabecera">
      <button id="btn-volver-menu" class="btn-volver" title="Volver al menú">⬅️ Menú</button>
      <h1 id="titulo-modo">🔢 Cuenta parada</h1>

      <div class="progreso-caja">
        <div class="progreso-info">
          <span id="contador">Ejercicio 1 de 20</span>
          <span id="estrellas">⭐ 0</span>
        </div>
        <div class="barra-progreso">
          <div class="barra-relleno" id="barra-relleno"></div>
        </div>
      </div>
    </header>

    <main id="juego">
      <section class="enunciado">
        <div class="emoji-personaje" id="emoji-personaje">🤔</div>
        <p id="texto-problema">Recordá: siempre calculamos desde atrás hacia adelante. ¡Primero las unidades!</p>
      </section>

      <section class="casita-seccion">
        <div class="casita-wrapper">
          <div class="casita" id="casita">

            <div class="fila fila-llevadas" id="fila-llevadas">
              <span class="celda col-op"></span>
              <span class="celda llevada" id="celda-llevada-c"><input type="text" inputmode="numeric" maxlength="1" id="llevada-c" tabindex="-1" aria-label="ayuda centenas"></span>
              <span class="celda llevada" id="celda-llevada-d"><input type="text" inputmode="numeric" maxlength="1" id="llevada-d" tabindex="-1" aria-label="ayuda decenas"></span>
              <span class="celda llevada" id="celda-llevada-u"><input type="text" inputmode="numeric" maxlength="1" id="llevada-u" tabindex="-1" aria-label="uno prestado"></span>
            </div>

            <div class="fila encabezado-cdu">
              <span class="celda col-op"></span>
              <span class="celda">C</span>
              <span class="celda">D</span>
              <span class="celda">U</span>
            </div>

            <div class="fila fila-a" id="fila-a">
              <span class="celda col-op"></span>
              <span class="celda digito" id="a-c"></span>
              <span class="celda digito" id="a-d"></span>
              <span class="celda digito" id="a-u"></span>
            </div>

            <div class="fila fila-b">
              <span class="celda col-op operador" id="operador-signo">+</span>
              <span class="celda digito" id="b-c"></span>
              <span class="celda digito" id="b-d"></span>
              <span class="celda digito" id="b-u"></span>
            </div>

            <div class="linea-cuenta"></div>

            <div class="fila fila-resultado">
              <span class="celda col-op"></span>
              <span class="celda celda-resultado">
                <input type="text" inputmode="numeric" maxlength="1" id="input-c" disabled>
              </span>
              <span class="celda celda-resultado">
                <input type="text" inputmode="numeric" maxlength="1" id="input-d" disabled>
              </span>
              <span class="celda celda-resultado">
                <input type="text" inputmode="numeric" maxlength="1" id="input-u">
              </span>
            </div>
          </div>
        </div>
      </section>

      <p id="feedback" class="feedback"></p>
    </main>

    <div id="pantalla-final" class="pantalla-final oculto">
      <div class="contenido-final">
        <div class="trofeo">🏆</div>
        <h2>¡Felicitaciones!</h2>
        <p id="resumen-modo"></p>
        <p class="resumen-estrellas" id="resumen-estrellas">⭐ 0 de 20</p>
        <div class="botones-final">
          <button id="btn-jugar-de-nuevo">Jugar de nuevo 🔄</button>
          <button id="btn-ir-menu">Elegir otro modo 🏠</button>
        </div>
      </div>
    </div>
  </section>

</div>

<div id="confetti-container" aria-hidden="true"></div>

<script src="script.js"></script>
</body>
</html>
