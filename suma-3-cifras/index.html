<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sumas de 3 cifras - 2° grado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="cabecera">
    <h1>🔢 Sumas de 3 cifras</h1>
    <p class="subtitulo">Sumamos números de tres cifras por centenas, decenas y unidades</p>

    <div class="progreso-caja">
      <div class="progreso-info">
        <span id="contador">Ejercicio 1 de 20</span>
        <span id="estrellas">⭐ 0</span>
      </div>
      <div class="barra-progreso">
        <div class="barra-relleno" id="barra-relleno"></div>
      </div>
    </div>
  </header>

  <main id="juego">

    <section class="enunciado">
      <div class="emoji-personaje" id="emoji-personaje">🍫</div>
      <p id="texto-problema">Cargando ejercicio...</p>
    </section>

    <section class="esquema-seccion">
      <div class="diagrama-wrapper">
        <div class="diagrama" id="diagrama">
          <!-- Los casilleros y flechas se generan con JavaScript -->
        </div>
      </div>
    </section>

    <section class="respuesta-seccion">
      <button id="btn-verificar">Verificar ✅</button>
    </section>

    <p id="feedback" class="feedback"></p>

  </main>

  <div id="pantalla-final" class="pantalla-final oculto">
    <div class="contenido-final">
      <div class="trofeo">🏆</div>
      <h2>¡Felicitaciones!</h2>
      <p>Resolviste las 20 sumas de tres cifras.</p>
      <p class="resumen-estrellas" id="resumen-estrellas">⭐ 0 de 20</p>
      <button id="btn-reiniciar">Jugar de nuevo 🔄</button>
    </div>
  </div>

</div>

<div id="confetti-container" aria-hidden="true"></div>

<script src="script.js"></script>
</body>
</html>
